<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Thrennix</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-32.png" width="20" height="20" alt="">
    <strong>Thrennix</strong>
    <span id="status" class="status muted"><span class="dot"></span><span id="status-text">Checking…</span></span>
  </header>

  <label class="row">
    <span>Catch browser downloads</span>
    <span class="switch"><input type="checkbox" id="catch"><span class="slider"></span></span>
  </label>

  <section>
    <h2>Media on this page</h2>
    <div id="media"><p class="muted">Loading…</p></div>
  </section>

  <footer>
    <a href="#" id="options">Options</a>
    <a href="#" id="recheck">Check connection</a>
  </footer>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
